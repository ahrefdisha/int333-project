services:
  web-service:
    image: nginx:alpine
    container_name: int333-nginx-service
    ports:
      - "8081:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web:/usr/share/nginx/html:ro
    restart: unless-stopped

  puppet-enforcer:
    image: puppet/puppet-agent:latest
    container_name: int333-puppet-enforcer
    volumes:
      - ./manifests:/etc/puppetlabs/code/environments/production/manifests:ro
      - ./config:/opt/enforced-config
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "puppet parser validate /etc/puppetlabs/code/environments/production/manifests/site.pp &&
       puppet apply -e \"file { '/opt/enforced-config/nginx.conf': ensure => file, source => '/etc/puppetlabs/code/environments/production/manifests/baseline_nginx.conf', mode => '0644' }\" &&
       sleep infinity"
    restart: unless-stopped

  nagios:
    image: jasonrivers/nagios:latest
    container_name: int333-nagios
    ports:
      - "8082:80"
    environment:
      - NAGIOSADMIN_USER=nagiosadmin
      - NAGIOSADMIN_PASS=admin
    volumes:
      - ./nagios/objects/hosts.cfg:/opt/nagios/etc/objects/hosts.cfg:ro
      - ./nagios/objects/services.cfg:/opt/nagios/etc/objects/services.cfg:ro
      - ./nagios/objects/commands.cfg:/opt/nagios/etc/objects/custom_commands.cfg:ro
      - ./nagios/check_config_drift.sh:/opt/nagios/libexec/check_config_drift.sh:ro
      - ./manifests:/opt/manifests:ro
      - ./config:/opt/config:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "grep -q 'hosts.cfg' /opt/nagios/etc/nagios.cfg || echo 'cfg_file=/opt/nagios/etc/objects/hosts.cfg' >> /opt/nagios/etc/nagios.cfg;
       grep -q 'services.cfg' /opt/nagios/etc/nagios.cfg || echo 'cfg_file=/opt/nagios/etc/objects/services.cfg' >> /opt/nagios/etc/nagios.cfg;
       grep -q 'custom_commands.cfg' /opt/nagios/etc/nagios.cfg || echo 'cfg_file=/opt/nagios/etc/objects/custom_commands.cfg' >> /opt/nagios/etc/nagios.cfg;
       /usr/local/bin/start_nagios"
    depends_on:
      - web-service
    restart: unless-stopped

  metrics-exporter:
    image: nginx:alpine
    container_name: int333-metrics-exporter
    volumes:
      - ./metrics:/usr/share/nginx/html:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: int333-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    depends_on:
      - metrics-exporter
    restart: unless-stopped
