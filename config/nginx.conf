events {}
http {
    server {
        listen 80;
        server_name localhost;

        location / {
            default_type text/html;
            return 200 '<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INT333 SRE Control Plane</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 40px 20px; }
    .container { max-width: 780px; margin: 0 auto; }
    .badge { display: inline-block; background: #065f46; color: #34d399; padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 13px; }
    h1 { font-size: 28px; margin: 16px 0 8px; }
    p.sub { color: #94a3b8; margin-bottom: 28px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 18px; }
    .card h3 { margin: 0 0 8px; font-size: 13px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }
    .card .val { font-size: 20px; font-weight: 700; color: #38bdf8; }
    .ok { color: #4ade80 !important; }
    .box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    a.btn { display: inline-block; margin-top: 12px; margin-right: 10px; padding: 10px 16px; background: #2563eb; color: #fff; text-decoration: none; border-radius: 8px; font-size: 14px; font-weight: 600; }
    a.btn.sec { background: #334155; }
  </style>
</head>
<body>
  <div class="container">
    <span class="badge">&#9679; SYSTEM OPERATIONAL &amp; ENFORCED</span>
    <h1>Web Service Configuration Enforcement &amp; Uptime Monitor</h1>
    <p class="sub">INT333 DevOps / SRE Production Simulation &mdash; Puppet + Terraform + Prometheus + Docker</p>
    <div class="grid">
      <div class="card"><h3>Service Status</h3><div class="val ok">HEALTHY (HTTP 200)</div></div>
      <div class="card"><h3>Puppet State</h3><div class="val">ENFORCED</div></div>
      <div class="card"><h3>Drift Protection</h3><div class="val ok">SHA-256 ACTIVE</div></div>
    </div>
    <div class="box">
      <strong>Live Endpoints &amp; Observability</strong><br/>
      <a class="btn" href="/health" target="_blank">Inspect /health JSON</a>
      <a class="btn sec" href="http://localhost:9090/alerts" target="_blank">Open Prometheus Alerts</a>
    </div>
  </div>
</body>
</html>';
        }

        location /health {
            default_type application/json;
            return 200 '{"status":"UP","config":"ENFORCED","puppet":"ACTIVE","monitoring":"PROMETHEUS"}';
        }
    }
}
