name: DevOps Config & Script Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Shell Script Syntax
        run: bash -n scripts/monitor_recover.sh
      - name: Validate Nginx Configuration via Docker
        run: docker run --rm -v "$PWD/config/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:alpine nginx -t
